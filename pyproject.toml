[project]
name = "soar"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.7.1",
    "transformers>=4.52.0",
    "tokenizers==0.21.1",
    "datasets>=3.5.0",
    "trl>=0.16.0",
    "peft>=0.15.0",
    "accelerate>=1.6.0",
    "wandb>=0.19.0",
    "pyyaml>=6.0.2",
    "loguru>=0.7.3",
    "numpy<2.3.1",
    "pandas>=2.3.1",
    "scipy>=1.16.0",
    "pydantic>=2.11.7",
    "matplotlib>=3.10.3",
    "python-dotenv>=1.0.0",
    "python-docx>=1.2.0",
    "ipykernel>=6.29.0",
    "ipywidgets>=8.1.0",
]

[tool.uv.sources]
# Driver 535 (CUDA 12.2) cannot load PyPI's default torch 2.12+cu130 wheels.
# Pin to cu118 builds compatible with driver >= 520.
torch = { index = "pytorch-cu118" }

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
