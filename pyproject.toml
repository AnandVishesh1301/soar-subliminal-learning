[project]
name = "soar"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.7.1",
    "transformers>=4.52.0",
    "tokenizers==0.21.1",
    "datasets>=3.5.0",
    "trl>=0.16.0",
    "peft>=0.15.0",
    "accelerate>=1.6.0",
    "wandb>=0.19.0",
    "pyyaml>=6.0.2",
    "loguru>=0.7.3",
    "numpy<2.3.1",
    "pandas>=2.3.1",
    "scipy>=1.16.0",
    "pydantic>=2.11.7",
    "matplotlib>=3.10.3",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
